name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'
      - 'cursor/debug-apk-arm64-185b'

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx3500m -Dorg.gradle.vfs.watch=false -Dorg.gradle.project.reactNativeArchitectures=arm64-v8a -Dorg.gradle.project.android.enableMinifyInReleaseBuilds=true -Dorg.gradle.project.android.enableShrinkResourcesInReleaseBuilds=true"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::error::Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to repository Actions secrets."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        run: npx --yes eas-cli@16.32.0 build --platform android --profile debug --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_SUPPORT_FORM_URL: ${{ secrets.EXPO_PUBLIC_SUPPORT_FORM_URL }}
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      - name: Rename APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          BASE=$(node -p "require('./app.config.js').expo.extra.releaseApkBasename")
          DEST="${BASE}-${VER}-debug.apk"
          shopt -s nullglob
          files=(./*.apk)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected exactly one APK in repo root, found ${#files[@]}"
            printf '%s\n' "${files[@]}"
            exit 1
          fi
          mv "${files[0]}" "$DEST"
          echo "filename=${DEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_FILENAME: ${{ steps.apk.outputs.filename }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          MAX=$((49 * 1024 * 1024))
          SIZE=$(stat -c%s "$APK_FILENAME")
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "::error::Debug APK is ${SIZE} bytes, above the 49MB Telegram limit. No public copy was saved."
            rm -f "$APK_FILENAME"
            exit 1
          fi
          CAPTION=$(printf 'מסע דף (בדיקה) %s\nמתקינים לצד האפליקציה מחנות Play.' "$APK_VERSION")
          BODY_FILE=$(mktemp)
          HTTP=$(curl --silent --show-error --output "$BODY_FILE" --write-out '%{http_code}' \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${APK_FILENAME}" \
            --form "caption=${CAPTION}" \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" || true)
          rm -f "$APK_FILENAME"
          OK=$(jq -r 'if .ok == true then "true" else "false" end' "$BODY_FILE" 2>/dev/null || echo false)
          if [ "$HTTP" != "200" ] || [ "$OK" != "true" ]; then
            jq -r '.description // "Telegram request failed"' "$BODY_FILE" 2>/dev/null || echo "Telegram request failed"
            echo "::error::Telegram rejected the debug APK (HTTP ${HTTP}). No public copy was saved."
            rm -f "$BODY_FILE"
            exit 1
          fi
          rm -f "$BODY_FILE"
          echo "Debug APK sent to Telegram."
